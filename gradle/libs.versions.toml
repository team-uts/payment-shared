[versions]
java = "21"
kotlin = "2.3.21"

# Keep in sync with the consumer apps (payment-app, point-app).
spring-boot = "4.1.0"

spotless = "8.10.3"

snakeyaml = "2.7"
jackson-annotation = "2.22"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-lombok = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "kotlin" }

spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
# BOM only. Applied to the compile/test classpaths so versions line up with the
# consumer apps; never published as a dependency of this library.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }

spring-security-web = { module = "org.springframework.security:spring-security-web" }
spring-context = { module = "org.springframework:spring-context" }
spring-web = { module = "org.springframework:spring-web" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-orm = { module = "org.springframework:spring-orm" }
spring-test = { module = "org.springframework:spring-test" }

jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
slf4j-api = { module = "org.slf4j:slf4j-api" }

hibernate-core = { module = "org.hibernate.orm:hibernate-core" }
h2database = { module = "com.h2database:h2" }

lombok = { module = "org.projectlombok:lombok" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
mockito-core = { module = "org.mockito:mockito-core" }

google-gson = { module = "com.google.code.gson:gson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
jackson-annotation = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotation" }
