name: CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  JAVA_DIST: 'temurin'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Plugin functional test
        run: ./gradlew clean test

      - name: Build
        run: ./gradlew clean build

      - name: Verify publication
        run: ./gradlew publishLibraryPublicationToPagesRepository -Pversion=ci-snapshot
