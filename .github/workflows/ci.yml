name: CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # `build` runs compileJava, test and spotlessCheck.
      - name: Build
        run: ./gradlew build

      # JitPack builds on its own machine with its own command, so a green `build`
      # does not prove a release will resolve. Run what JitPack runs.
      - name: Verify JitPack publication
        run: ./gradlew publishToMavenLocal -Pversion=ci-snapshot
